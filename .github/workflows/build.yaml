name: build

on:
  workflow_call:
    inputs:
      name:
        description: "Workflow name"
        type: string
        required: true
      imageRegistry:
        description: "Container image registry name"
        type: string
        required: true
      imageTags:
        description: "Image tags"
        type: string
        required: true
      dockerfilePath:
        description: "Path in which is stored the Dockerfile"
        type: string
        required: true
      buildTarget:
        description: "Target of the image build"
        type: string
        required: true
      buildArgs:
        description: "docker build arguments"
        type: string
        required: true

jobs:
  build:
    runs-on: ${{ matrix.config.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.imageRegistry }}
          tags: ${{ inputs.imageTags }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfilePath }}
          target: ${{ inputs.buildTarget }}
          platforms: ${{ matrix.config.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.buildArgs }}
          outputs: type=image,name=${{ inputs.imageRegistry }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Set sanitized platform
        run: echo "SANITIZED_PLATFORM=${{ matrix.config.platform }}" | sed 's/\//-/g' >> $GITHUB_ENV
      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ inputs.name }}-${{ env.SANITIZED_PLATFORM }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          pattern: digests-${{ inputs.name }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.imageRegistry }}
          tags: ${{ inputs.imageTags }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
          $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf '${{ inputs.imageRegistry }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ inputs.imageRegistry }}:${{ steps.meta.outputs.version }}
